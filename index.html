<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine Loan Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .nav-tabs { display: flex; background: white; border-bottom: 2px solid #e0e0e0; }
        .nav-tab { flex: 1; padding: 16px; text-align: center; cursor: pointer; border-bottom: 3px solid transparent; }
        .nav-tab.active { border-bottom-color: #2a5298; color: #2a5298; font-weight: 600; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .content { display: none; background: white; border-radius: 8px; padding: 20px; }
        .content.active { display: block; }
        .btn { padding: 12px 24px; background: #2a5298; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #1e3c72; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f5f5f5; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; }
        .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status.active { background: #e8f5e9; color: #2e7d32; }
        .status.returned { background: #f3e5f5; color: #7b1fa2; }
        .empty { text-align: center; padding: 40px; color: #999; }
        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Spine Loan Tracker</h1>
        <p>Evomedic Spine</p>
    </div>
    
    <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('loans')">Loans</div>
        <div class="nav-tab" onclick="switchTab('dashboard')">Dashboard</div>
        <div class="nav-tab" onclick="switchTab('activity')">Activity</div>
    </div>
    
    <div class="container">
        <div id="loans" class="content active">
            <input type="text" id="searchInput" placeholder="Search hospital, surgeon..." style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px;" onkeyup="filterLoans()">
            <button class="btn" onclick="showNewLoan()">+ New Loan</button>
            <div id="loansContainer" class="loading">Loading loans...</div>
        </div>
        
        <div id="dashboard" class="content">
            <h2>Dashboard</h2>
            <div id="dashboardContainer" class="loading">Loading dashboard...</div>
        </div>
        
        <div id="activity" class="content">
            <h2>Activity</h2>
            <div id="activityContainer" class="empty">Activity log coming soon</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://solrhwifqlmtwgyekuok.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvbHJod2lmcWxtdHdneWVrdW9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MTA4MDAsImV4cCI6MjA5NDM4NjgwMH0.u3L_a8IxqiBIBaiLziyK2I6-UwW9v9ftUjoSgis0cSU';
        
        let allLoans = [];
        
        async function fetchLoans() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/loans?order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                allLoans = await response.json();
                renderLoans();
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('loansContainer').innerHTML = '<div class="empty">Error loading loans: ' + error.message + '</div>';
            }
        }
        
        function renderLoans(filtered = null) {
            const loans = filtered || allLoans;
            
            if (loans.length === 0) {
                document.getElementById('loansContainer').innerHTML = '<div class="empty">No loans yet. Tap + New Loan to start.</div>';
                return;
            }
            
            let html = '<table><thead><tr><th>Hospital</th><th>Surgeon</th><th>Borrow Date</th><th>Return Date</th><th>Status</th></tr></thead><tbody>';
            loans.forEach(loan => {
                const status = loan.status || 'ACTIVE';
                html += `<tr><td>${loan.hospital || '-'}</td><td>${loan.surgeon || '-'}</td><td>${loan.borrow_date || '-'}</td><td>${loan.return_date || '-'}</td><td><span class="status ${status.toLowerCase()}">${status}</span></td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('loansContainer').innerHTML = html;
        }
        
        function filterLoans() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allLoans.filter(loan => 
                (loan.hospital && loan.hospital.toLowerCase().includes(search)) ||
                (loan.surgeon && loan.surgeon.toLowerCase().includes(search))
            );
            renderLoans(filtered);
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            if (tab === 'dashboard') renderDashboard();
        }
        
        function renderDashboard() {
            const total = allLoans.length;
            const active = allLoans.filter(l => l.status === 'ACTIVE').length;
            const returned = allLoans.filter(l => l.status === 'RETURNED').length;
            document.getElementById('dashboardContainer').innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 20px;">
                    <div style="background: #f5f5f5; padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 32px; font-weight: bold; color: #2a5298;">${total}</div>
                        <div style="color: #666; margin-top: 5px;">Total</div>
                    </div>
                    <div style="background: #f5f5f5; padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 32px; font-weight: bold; color: #f57c00;">${active}</div>
                        <div style="color: #666; margin-top: 5px;">Active</div>
                    </div>
                    <div style="background: #f5f5f5; padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 32px; font-weight: bold; color: #7b1fa2;">${returned}</div>
                        <div style="color: #666; margin-top: 5px;">Returned</div>
                    </div>
                </div>
            `;
        }
        
        function showNewLoan() {
            alert('New Loan form - coming soon');
        }
        
        fetchLoans();
    </script>
</body>
</html>
